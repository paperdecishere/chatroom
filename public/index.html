<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatroom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 18px;
      background: #222;
      border-bottom: 1px solid #333;
      font-size: 20px;
      font-weight: bold;
    }

    .username {
      color: #888;
      font-size: 13px;
      margin-top: 5px;
      font-weight: normal;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      margin-bottom: 12px;
    }

    .name {
      color: #4da6ff;
      font-weight: bold;
      margin-right: 6px;
    }

    .text {
      color: #eee;
      word-wrap: break-word;
    }

    .system {
      color: #777;
      font-size: 13px;
      font-style: italic;
      margin-bottom: 10px;
    }

    form {
      display: flex;
      padding: 12px;
      background: #222;
      border-top: 1px solid #333;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      outline: none;
      font-size: 15px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #4da6ff;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #3388dd;
    }
  </style>
</head>

<body>

  <div class="chat">
    <div class="header">
      💬 Chatroom
      <div class="username" id="username">Connecting...</div>
    </div>

    <div id="messages"></div>

    <form id="form">
      <input
        id="input"
        autocomplete="off"
        maxlength="500"
        placeholder="Type a message..."
      >
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const username = document.getElementById("username");

    socket.on("username", (name) => {
      username.textContent = "You are " + name;
    });

    socket.on("chat message", (data) => {
      const message = document.createElement("div");
      message.className = "message";

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = data.username + ":";

      const text = document.createElement("span");
      text.className = "text";
      text.textContent = " " + data.message;

      message.appendChild(name);
      message.appendChild(text);

      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;
    });

    socket.on("system", (messageText) => {
      const message = document.createElement("div");
      message.className = "system";
      message.textContent = messageText;

      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const message = input.value.trim();

      if (!message) return;

      socket.emit("chat message", message);

      input.value = "";
      input.focus();
    });
  </script>

</body>
</html>
